name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Security Scan, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Scan
        run: pnpm audit --audit-level=high

      - name: Ring Boundary & Architecture Checks
        run: pnpm check:boundaries && pnpm audit:schema && pnpm check:mobile-interaction

      - name: i18n Parity Check
        run: pnpm check-i18n

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          NEON_AUTH_BASE_URL: https://placeholder.neon.tech
          NEON_AUTH_JWKS_URL: https://placeholder.neon.tech/jwks.json
          NODE_ENV: test

      - name: Build
        run: pnpm build

  deploy-api:
    name: Deploy Fastify API Worker
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Drizzle DB Migrations
        run: pnpm --filter @kaesava/db exec tsx src/apply-migrations.ts --prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy Money Matters API to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/money-matters/api
          command: deploy

      - name: Deploy Tradie Matters API to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/tradie-matters/api
          command: deploy

  deploy-web:
    name: Deploy Next.js Web Workers
    runs-on: ubuntu-latest
    needs: [ci, deploy-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Money Matters Web OpenNext Bundle
        run: pnpm --filter @money-matters/web cf-build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-09JB3KHGT9,GTM-M42L5HLB

      - name: Deploy Money Matters Web to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/money-matters/web
          command: deploy

      - name: Build Tradie Matters Web OpenNext Bundle
        run: pnpm --filter @tradie-matters/web cf-build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-7FRF4E8Z4M,GTM-K2TX2GCF

      - name: Deploy Tradie Matters Web to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/tradie-matters/web
          command: deploy
